<script>
(() => {
const W = 1920, H = 1080, DUR = 15;
const K = 2.3, REAL = DUR * K;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const FONT = 'Inter, system-ui, -apple-system, "Segoe UI", sans-serif';
const ACC = '#2563eb', VIO = '#7c3aed';
const PAL = ['#2563eb', '#e11d48', '#059669', '#d97706', '#7c3aed', '#0891b2'];
const INK = '#14161a', MUTE = '#6b7280', BG = '#f7f6f2';
const POSTER = 5.7;
const BND = [2, 6, 8, 12, 13];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const mulberry = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function T(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = `${o.w || 600} ${o.s || 48}px ${FONT}`;
  ctx.fillStyle = o.c || INK;
  ctx.textAlign = o.al || 'left';
  ctx.textBaseline = 'alphabetic';
  if (o.m) ctx.fillText(s, x, y, o.m); else ctx.fillText(s, x, y);
  ctx.restore();
}
function TC(s, x, y, o, t, ts, stag = .04, dur = .55, rise = 70) {
  ctx.save();
  const base = ctx.globalAlpha;
  ctx.font = `${o.w || 800} ${o.s}px ${FONT}`;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const total = ctx.measureText(s).width;
  const sx = o.al === 'center' ? x - total / 2 : x;
  for (let i = 0; i < s.length; i++) {
    const p = prog(t, ts + i * stag, ts + i * stag + dur);
    if (p <= 0) continue;
    const px = sx + ctx.measureText(s.slice(0, i)).width;
    ctx.globalAlpha = base * clamp(p * 2.2);
    ctx.fillStyle = typeof o.c === 'function' ? o.c(i, s[i]) : (o.c || INK);
    ctx.fillText(s[i], px, y + (1 - eBack(p)) * rise);
  }
  ctx.restore();
}
function glass(x, y, w, h, r = 40) {
  ctx.save();
  ctx.shadowColor = 'rgba(20,22,26,.16)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 22;
  ctx.fillStyle = 'rgba(255,255,255,.86)'; rr(x, y, w, h, r); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2; rr(x, y, w, h, r); ctx.stroke(); ctx.restore();
}
function pill(x, y, text, size, fill, color, padX = 18, h = null) {
  ctx.save();
  ctx.font = `600 ${size}px ${FONT}`;
  const w = ctx.measureText(text).width + padX * 2;
  const hh = h || size * 1.7;
  ctx.fillStyle = fill; rr(x, y, w, hh, hh / 2); ctx.fill();
  ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(text, x + padX, y + hh / 2 + 1);
  ctx.restore();
  return w;
}
function cursor(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.32)'; ctx.shadowBlur = 7; ctx.shadowOffsetY = 7;
  ctx.fillStyle = INK; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 36); ctx.lineTo(10, 27); ctx.lineTo(16, 42); ctx.lineTo(23, 39); ctx.lineTo(17, 25); ctx.lineTo(29, 25); ctx.closePath();
  ctx.stroke(); ctx.fill(); ctx.restore();
}
function kf(t, keys) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t >= a[0] && t <= b[0]) { const p = eIO((t - a[0]) / (b[0] - a[0] || 1)); return [lerp(a[1], b[1], p), lerp(a[2], b[2], p)]; }

  const l = keys[keys.length - 1]; return [l[1], l[2]];
}
function cam(t, a, b, fn) {
  ctx.save();
  const z = 1 + .018 * prog(t, a, b);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  fn(); ctx.restore();
}

const rnd = mulberry(7);
const PART = Array.from({ length: 30 }, () => ({ x: rnd() * W, y: rnd() * H, vx: (rnd() - .5) * 26, vy: (rnd() - .5) * 26, r: 2 + rnd() * 3 }));
const bgc = document.createElement('canvas'); bgc.width = 960; bgc.height = 540;
(() => {
  const g = bgc.getContext('2d');
  g.fillStyle = BG; g.fillRect(0, 0, 960, 540);
  const blob = (cx, cy, r, c) => {
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(cx - r, cy - r, r * 2, r * 2);
  };
  blob(830, 90, 300, 'rgba(37,99,235,.15)');
  blob(110, 470, 280, 'rgba(124,58,237,.12)');
  const v = g.createRadialGradient(480, 270, 290, 480, 270, 570);
  v.addColorStop(0, 'rgba(20,22,26,0)'); v.addColorStop(1, 'rgba(20,22,26,.10)');
  g.fillStyle = v; g.fillRect(0, 0, 960, 540);
})();
function bg(t) {
  ctx.drawImage(bgc, 0, 0, W, H);
  const pts = PART.map(p => [((p.x + p.vx * t) % W + W) % W, ((p.y + p.vy * t) % H + H) % H, p.r]);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(37,99,235,.13)'; ctx.beginPath();
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];
    if (dx * dx + dy * dy < 40000) { ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[j][0], pts[j][1]); }
  }
  ctx.stroke();
  ctx.fillStyle = 'rgba(37,99,235,.32)'; ctx.beginPath();
  pts.forEach(p => { ctx.moveTo(p[0] + p[2], p[1]); ctx.arc(p[0], p[1], p[2], 0, 6.283); });
  ctx.fill();
}
function finish_fx(t) {}

function wipes(t) {
  BND.forEach(b => {
    const p = prog(t, b - .27, b + .27);
    if (p <= 0 || p >= 1) return;
    const BW = W * 1.3, SL = 260;
    const draw = (pp, col) => {
      const lead = lerp(-100, W + BW + 100, eIO(clamp(pp))), trail = lead - BW;
      ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(trail, 0); ctx.lineTo(lead, 0); ctx.lineTo(lead - SL, H); ctx.lineTo(trail - SL, H); ctx.closePath(); ctx.fill();
    };
    draw(p - .07, '#1e1b4b');
    draw(p - .035, VIO);
    draw(p, ACC);
  });
}

function s0(t) {
  const s = eBack(prog(t, .1, .85));
  ctx.save(); ctx.translate(W / 2, H / 2 - 40);
  // ring draw
  const rp = eOut(prog(t, .15, 1.1));
  ctx.save(); ctx.rotate(-1.5708); ctx.strokeStyle = 'rgba(37,99,235,.45)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const circ = 2 * Math.PI * 215; ctx.setLineDash([circ * rp, circ]);
  ctx.beginPath(); ctx.arc(0, 0, 215, 0, 6.283); ctx.stroke(); ctx.restore();
  // burst
  const br = mulberry(11);
  for (let i = 0; i < 28; i++) {
    const a = br() * 6.283, sp = 260 + br() * 340, p = prog(t, .6, 1.5);
    if (p <= 0 || p >= 1) continue;
    const d = 130 + sp * eOut(p);
    ctx.globalAlpha = 1 - p; ctx.fillStyle = PAL[i % 6];
    ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, 5 + br() * 7 * (1 - p), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.scale(s, s);
  ctx.save(); ctx.shadowColor = 'rgba(37,99,235,.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 30;
  const g = ctx.createLinearGradient(-120, -120, 120, 120); g.addColorStop(0, ACC); g.addColorStop(1, VIO);
  ctx.fillStyle = g; rr(-120, -120, 240, 240, 66); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha = .18; ctx.fillStyle = '#fff'; rr(-120, -120, 240, 110, 66); ctx.fill(); ctx.restore();
  T('UP', 0, 34, { s: 112, w: 800, c: '#fff', al: 'center' });
  ctx.restore();
  TC('Uday Pratap', W / 2, H / 2 + 250, { s: 58, w: 700, al: 'center', c: INK }, t, .8, .045, .45, 34);
  T('Full-stack  ·  ML', W / 2, H / 2 + 305, { s: 30, w: 600, c: MUTE, al: 'center', a: eOut(prog(t, 1.25, 1.7)) });
}

const WORDS = ['MERN', 'apps,', 'ML', 'models', '&', 'clean', 'UIs.'];
let LAY = null;
function layout() {
  ctx.save();
  ctx.font = `800 88px ${FONT}`;
  const sp = ctx.measureText(' ').width;
  let x = 160, y = 600; const maxX = 1130; LAY = [];
  const items = [['I build', INK]].concat(WORDS.map((w, i) => [w, PAL[i % PAL.length]]));
  items.forEach(([s, c], i) => {
    const w = ctx.measureText(s).width;
    if (x + w > maxX && i > 0) { x = 160; y += 118; }
    LAY.push({ s, c, x, y }); x += w + sp;
  });
  ctx.restore();
}

    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = nb; f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 3;
    g.gain.setValueAtTime(.25, at); g.gain.exponentialRampToValueAtTime(.001, at + .05);
    s.connect(f); f.connect(g); g.connect(master); s.start(at); s.stop(at + .08);
  };

  // chord progression Am | F | C | G, one bar = 2 s
  const CH = [[220, 261.63, 329.63, 55], [174.61, 220, 261.63, 43.65], [261.63, 329.63, 392, 65.41], [196, 246.94, 293.66, 49]];
  for (let bar = 0; bar < Math.ceil(REAL / 2); bar++) {
    const c = CH[bar % 4], at = t0 + bar * 2;
    [0, 1, 2].forEach(i => { tone(at, c[i], 'sawtooth', .022, .35, 1.9, bus); tone(at, c[i] * 1.004, 'sawtooth', .018, .35, 1.9, bus); });
    if (bar >= 1) for (let k = 0; k < 8; k++) tone(at + k * .25, c[3], 'sine', k % 2 ? .0 : .22, .01, .22, bus);
    const arp = [0, 1, 2, 1, 2, 1, 0, 1];
    for (let k = 0; k < 8; k++) tone(at + k * .25, c[arp[k]] * 2, 'triangle', .07, .008, .32, bus);
  }
  for (let k = 6; k < Math.floor(REAL / .5) - 1; k++) { kick(t0 + k * .5); hat(t0 + k * .5 + .25, k % 4 === 3); if (k % 2 === 1) clap(t0 + k * .5); }
  BND.forEach(b => { const bt = b * K; riser(t0 + bt - .8, .75); whoosh(t0 + bt - .45); boom(t0 + bt); });
  // typed-word blips and cursor clicks
  for (let i = 0; i < 7; i++) tone(t0 + (3.2 + i * .34) * K, 1500 + i * 90, 'sine', .05, .004, .06, master);
  CLICKS.forEach(c => click(t0 + c * K));
  [880, 1108.7, 1318.5].forEach((f, i) => tone(t0 + 13.85 * K + i * .08, f, 'sine', .12, .02, 1.3, master));
}
function stopAudio() { try { if (actx) actx.close(); } catch (e) {} actx = master = dest = null; }

let state = 'idle', t0v = 0, rec = null, chunks = [];
function stopRec(discard) {
  if (rec && rec.state !== 'inactive') { if (discard) rec.onstop = null; try { rec.stop(); } catch (e) {} }
  rec = null;
}
function startRec() {
  if (!window.MediaRecorder || !cv.captureStream) { hint.textContent = 'Recording is not supported in this browser. Try Chrome.'; return; }
  const stream = cv.captureStream(60);
  if (dest) dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const mimes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = mimes.find(m => MediaRecorder.isTypeSupported(m)) || '';
  chunks = [];
  rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 14e6 } : { videoBitsPerSecond: 14e6 });
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'reel.webm';
    document.body.appendChild(a); a.click(); a.remove();
    hint.textContent = 'Saved reel.webm. Convert to MP4 in CapCut or any online converter.';
  };
  rec.start(200);
  hint.textContent = '● Recording… reel.webm will download when the video ends.';
}
function start(record) {
  stopRec(true); stopAudio();
  buildAudio();
  state = 'playing'; t0v = performance.now() + 50;
  if (record) startRec(); else hint.innerHTML = 'Playing… &nbsp;·&nbsp; <b>Space</b> restart &nbsp;·&nbsp; <b>R</b> record &amp; download reel.webm';
}
function finish() {
  state = 'done';
  if (rec) setTimeout(() => stopRec(false), 450);
  else hint.innerHTML = 'Done. Click to replay &nbsp;·&nbsp; <b>Space</b> restart &nbsp;·&nbsp; <b>R</b> record &amp; download reel.webm';
}
function overlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(247,246,242,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.shadowColor = 'rgba(37,99,235,.5)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 20;
  ctx.fillStyle = ACC; ctx.beginPath(); ctx.arc(W / 2, H / 2 - 20, 100, 0, 6.283); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(W / 2 - 28, H / 2 - 70); ctx.lineTo(W / 2 - 28, H / 2 + 30); ctx.lineTo(W / 2 + 58, H / 2 - 20); ctx.closePath(); ctx.fill();
  T(state === 'done' ? 'Click to replay' : 'Click to play', W / 2, H / 2 + 190, { s: 48, w: 800, al: 'center' });
  T('Space restarts  ·  R records reel.webm', W / 2, H / 2 + 250, { s: 32, w: 600, c: MUTE, al: 'center' });
  ctx.restore();
}
function frame(now) {
  let t;
  if (state === 'playing') {
    const r = Math.max(0, (now - t0v) / 1000);
    if (r >= REAL) { t = DUR - .001; finish(); } else t = r / K;
  } else t = state === 'done' ? DUR - .001 : POSTER;
  render(t);
  if (state !== 'playing') overlay();
  requestAnimationFrame(frame);
}

cv.addEventListener('click', () => { if (state !== 'playing') start(false); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); start(false); }
  else if (e.key === 'r' || e.key === 'R') start(true);
});

let started = false;
function init() { if (started) return; started = true; layout(); requestAnimationFrame(frame); }
const loads = ['400', '600', '700', '800'].map(w => document.fonts.load(`${w} 40px Inter`));
Promise.all(loads).catch(() => {}).then(init);
setTimeout(init, 2500);
})();
</script>
